name: release

on:
  push:
    branches:
      - master
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 25
          cache: maven

      - name: Set up Maven
        uses: stCarolas/setup-maven@v4.5
        with:
          maven-version: 3.9.1

      - name: Read version from pom.xml
        id: version
        shell: bash
        run: |
          version=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [[ "$version" == *-SNAPSHOT ]]; then
            echo "Version $version is a snapshot, skipping release"
            echo "release=false" >> "$GITHUB_OUTPUT"
          elif git rev-parse -q --verify "refs/tags/$version" >/dev/null; then
            echo "Tag $version already exists, skipping release"
            echo "release=false" >> "$GITHUB_OUTPUT"
          else
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Build
        if: steps.version.outputs.release == 'true'
        run: mvn -B clean package

      - name: Create GitHub release
        if: steps.version.outputs.release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.version }}
          name: ${{ steps.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            FundamentalsCore/target/*.jar
            FundamentalsImport/target/*.jar
